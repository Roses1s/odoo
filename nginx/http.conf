# Plain-HTTP entrypoint. This is what a fresh checkout ships and mounts by
# default (see docker-compose.yml) — for local dev, for CI, and for the very
# first boot in production, *before* a TLS certificate exists.
#
# nginx/https.conf additionally terminates TLS on :443 and requires a
# certificate file to already be on disk; nginx refuses to start at all if
# that file is missing, which makes it unusable as a bootstrap config on a
# brand-new server (no cert yet) — including for the ACME HTTP-01 challenge
# used to obtain that very first cert. This file has no such dependency, so
# it can always come up, and it already serves `/.well-known/acme-challenge/`
# from the same webroot certbot writes to. Once a real certificate exists,
# switch the mounted file to nginx/https.conf (see DEPLOY.md, "HTTPS").
upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name crmdetroid.ru www.crmdetroid.ru 77.222.38.191 localhost;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location /django-admin/ {
        return 404;
    }

    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
