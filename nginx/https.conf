# TLS entrypoint — requires a real certificate at the paths below, or nginx
# refuses to start. Only mount this once certbot has actually issued one
# (see DEPLOY.md, "HTTPS"); until then docker-compose.yml mounts
# nginx/http.conf instead, which needs no certificate to come up.
upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name crmdetroid.ru www.crmdetroid.ru 77.222.38.191;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://crmdetroid.ru$request_uri;
    }
}

server {
    # The old form works on every nginx version; `http2 on;` would break
    # startup on anything older than 1.25 and take the site down with it.
    listen 443 ssl http2;
    server_name crmdetroid.ru www.crmdetroid.ru;

    # Text responses travel roughly three times smaller compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    ssl_certificate /etc/letsencrypt/live/crmdetroid.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crmdetroid.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 25m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The SPA is served from here, so its policy has to live here too: the
    # CSP configured in Django only covers API responses.
    #   style-src 'unsafe-inline' — the app sets inline styles (stage arrows);
    #   img-src/frame-src blob:   — attachment previews are rendered from memory;
    #   fonts.*                   — Inter is loaded from Google Fonts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location /django-admin/ {
        return 404;
    }

    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
