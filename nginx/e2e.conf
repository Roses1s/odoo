# Puts the built frontend and the API on one origin for the end-to-end run,
# the same way the production proxy does.
upstream e2e_backend { server backend:8000; }
upstream e2e_frontend { server frontend:80; }

server {
    listen 80;
    server_name localhost;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://e2e_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://e2e_frontend;
        proxy_set_header Host $host;
    }
}
