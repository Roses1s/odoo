server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Asset file names contain a content hash, so a new build produces new
    # names: the old ones can be cached forever. Without this the browser
    # re-downloaded the whole bundle on every visit.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry point must never be cached, otherwise users keep loading an
    # old build that points at deleted asset files.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
