# Without a size limit the json-file driver grows until the disk is full.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

volumes:
  pgdata:
  backups:
  media:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_user} -d ${POSTGRES_DB:-crm_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      RUN_MIGRATIONS: "1"
      SEED: ${SEED:-0}
    env_file: .env
    volumes:
      - backups:/backups
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8000), 3); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  celery_worker:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      RUN_MIGRATIONS: "0"
    env_file: .env
    volumes:
      - backups:/backups
      - media:/app/media:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    command: celery -A config beat -l info -s /backups/celerybeat-schedule
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      RUN_MIGRATIONS: "0"
    env_file: .env
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
