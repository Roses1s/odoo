# Memory budget for a 2 GB host with no swap, measured against real usage:
# each ceiling leaves a two- to threefold margin, and the total stays below
# what the machine has, so a leak gets the offending container restarted
# instead of letting the kernel pick a victim — usually PostgreSQL.
#
#   database 512  backend 512  worker 320  scheduler 192
#   cache    128  nginx    64  frontend 64   = 1792 MB
#
# Raise a ceiling if `docker stats` shows a container above roughly half of it.

# Without a size limit the json-file driver grows until the disk is full.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

volumes:
  pgdata:
  backups:
  media:
  # Shared between nginx and the one-off certbot container used to obtain/renew
  # the TLS certificate (see DEPLOY.md, "HTTPS"); nginx serves whatever certbot
  # writes here under /.well-known/acme-challenge/.
  certbot-webroot:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_user} -d ${POSTGRES_DB:-crm_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      RUN_MIGRATIONS: "1"
      SEED: ${SEED:-0}
    env_file: .env
    volumes:
      - backups:/backups
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8000), 3); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  celery_worker:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 320M
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      RUN_MIGRATIONS: "0"
    env_file: .env
    volumes:
      - backups:/backups
      - media:/app/media:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 192M
    command: celery -A config beat -l info -s /backups/celerybeat-schedule
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      RUN_MIGRATIONS: "0"
    env_file: .env
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64M
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # http.conf needs no certificate and is what a fresh checkout serves —
      # locally, in CI, and on a brand-new server before certbot has run.
      # Switch this to nginx/https.conf once a real certificate exists under
      # /etc/letsencrypt (see DEPLOY.md, "HTTPS"), then recreate this service.
      - ./nginx/http.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
